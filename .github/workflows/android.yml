name: Android demo CI

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

jobs:
  android-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: '' # obsolete Android SDK 'tools' package is no longer published
      - name: Install Android 37 SDK
        run: sdkmanager --install "platforms;android-37" "build-tools;36.0.0"
      - name: Compile app and run TAL/demo tests
        working-directory: mobile
        run: bash ./gradlew --no-daemon :tal-core:test :app:assembleDemoDebug :app:testDemoDebugUnitTest
